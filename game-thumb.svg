<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Khiên công an và điện thoại có tin nhắn lừa đảo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ece0"/>
      <stop offset="1" stop-color="#a6cbb6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7a5c"/>
      <stop offset="1" stop-color="#184a37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0e2a1f" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="150" fill="#fff" opacity=".18"/>
  <circle cx="730" cy="540" r="190" fill="#fff" opacity=".16"/>
  <circle cx="690" cy="90" r="9" fill="#fff" opacity=".6"/>
  <circle cx="120" cy="500" r="7" fill="#fff" opacity=".6"/>
  <circle cx="330" cy="560" r="5" fill="#fff" opacity=".6"/>

  <!-- Điện thoại -->
  <g transform="rotate(-7 275 300)" filter="url(#shadow)">
    <rect x="150" y="80" width="250" height="430" rx="38" fill="#17271f"/>
    <rect x="164" y="98" width="222" height="394" rx="28" fill="#ffffff"/>
    <rect x="240" y="106" width="70" height="10" rx="5" fill="#17271f"/>
    <rect x="164" y="128" width="222" height="44" fill="#eef3ee"/>
    <circle cx="190" cy="150" r="12" fill="#a6cbb6"/>
    <rect x="212" y="141" width="96" height="10" rx="5" fill="#9bb3a4"/>
    <rect x="212" y="157" width="60" height="8" rx="4" fill="#c4d4ca"/>
    <!-- tin nhắn -->
    <rect x="180" y="190" width="150" height="40" rx="14" fill="#eef3ee"/>
    <rect x="194" y="203" width="110" height="8" rx="4" fill="#b6c8bd"/>
    <rect x="194" y="217" width="70" height="6" rx="3" fill="#cfdcd4"/>
    <rect x="180" y="248" width="196" height="84" rx="14" fill="#fbe6e1"/>
    <text x="194" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#b4483a">Nộp cọc 200k</text>
    <text x="194" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b4483a">ngay trong 10 phút!</text>
    <rect x="180" y="350" width="112" height="38" rx="14" fill="#eef3ee"/>
    <rect x="194" y="365" width="80" height="8" rx="4" fill="#b6c8bd"/>
    <rect x="180" y="440" width="190" height="34" rx="17" fill="#eef3ee"/>
    <!-- cảnh báo -->
    <circle cx="378" cy="118" r="32" fill="#c25a49" stroke="#ffffff" stroke-width="7"/>
    <rect x="374" y="98" width="8" height="26" rx="4" fill="#fff"/>
    <circle cx="378" cy="136" r="4.5" fill="#fff"/>
  </g>

  <!-- Khiên công an -->
  <g filter="url(#shadow)">
    <path d="M565 150 L685 196 V318 C685 398 630 454 565 486 C500 454 445 398 445 318 V196 Z"
          fill="url(#shield)" stroke="#c9a96a" stroke-width="11" stroke-linejoin="round"/>
    <path d="M565 176 L663 213 V317 C663 382 619 428 565 456 C511 428 467 382 467 317 V213 Z"
          fill="none" stroke="#c9a96a" stroke-width="3" opacity=".7" stroke-linejoin="round"/>
    <polygon points="565,206 574,228 598,230 580,246 586,269 565,256 544,269 550,246 532,230 556,228" fill="#c9a96a"/>
    <path d="M512 336 L551 375 L620 296" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
